[package]
name = "artcraft-launcher-ui-egui"
description = "ArtCraft Launcher's egui interface, shared by the desktop and web builds"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
artcraft-launcher-core = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true, features = ["image", "svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { workspace = true }
log = { workspace = true }
unicode-bidi = "0.3.18"

# Craft AI's model-runtime bridge (`craft_ai/engine.rs`): the loopback HTTP client. Native only —
# the web build draws the dialog's note instead, and ureq's TLS stack does not build for wasm32.
# The native crate keeps its own ureq 3 for updates; two majors in one tree are fine.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "2", features = ["json"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The OS's preferred UI languages, without spawning `defaults` or `reg.exe`.
sys-locale = "0.3"
# Finding the Simplified Chinese face in a system font collection; egui already uses it.
skrifa = { version = "0.44", default-features = false, features = ["std"] }

[dev-dependencies]
serde_json = { workspace = true }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
