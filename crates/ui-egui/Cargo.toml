[package]
name = "artcraft-launcher-ui-egui"
description = "ArtCraft Launcher's egui interface, shared by the desktop and web builds"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
artcraft-launcher-core = { workspace = true }
craft-ext-core = { workspace = true }
# Interim: a path dependency until the shared AI layer has a home (craft-libs). Pure data, wasm-safe.
craft-ai-model = { path = "../../../craft-ai-wt-folders/crates/ai-core", package = "craft-ai-core" }
craft-ai-features = { path = "../../../craft-ai-wt-folders/crates/ai-features" }
egui = { workspace = true }
egui_extras = { workspace = true, features = ["image", "svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { workspace = true }
log = { workspace = true }
# Local calendar dates, matching the current launcher UI PR.
jiff = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The OS's preferred UI languages, without spawning `defaults` or `reg.exe`.
sys-locale = "0.3"
# Finding the Simplified Chinese face in a system font collection; egui already uses it.
skrifa = { version = "0.44", default-features = false, features = ["std"] }

[dev-dependencies]
craft-ai-features = { path = "../../../craft-ai-wt-folders/crates/ai-features" }
serde_json = { workspace = true }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
