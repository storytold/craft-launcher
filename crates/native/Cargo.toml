[package]
name = "artcraft-launcher-native"
description = "ArtCraft Launcher desktop backend: release lookups, detecting installed Craft Apps, installing and updating them"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# Lets ARTCRAFT_LAUNCHER_DOWNLOAD_BASE point the launcher at a developer's own loopback mirror
# (`cargo xtask local serve`). Development only: release builds never enable it, so a shipped
# launcher can't be steered away from GitHub's releases by an environment variable.
local-mirror = []

[dependencies]
artcraft-launcher-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
dirs = "6"
tempfile = "3"
sha2 = "0.10"
# Resizing a bundled icon to the sizes an OS asks for (the icon theme's folders, a Windows .ico).
# Already in Cargo.lock through the desktop shell.
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
# HTTPS over rustls, with the OS verifying certificates (rustls-platform-verifier). No bundled
# root list: webpki-roots and webpki-root-certs are CDLA-licensed.
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "_ring", "gzip", "platform-verifier"] }

[target.'cfg(unix)'.dependencies]
flate2 = "1"
tar = { version = "0.4", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
# Setting an app's custom Finder icon (app_icons.rs). Safe AppKit calls only, pinned exactly to the
# versions the desktop shell already uses.
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData", "NSObject", "NSString"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSImage", "NSWorkspace"] }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
