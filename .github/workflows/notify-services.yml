name: Notify Services on Release Change

on:
  release:
    types:
      - published
      - unpublished
      - created
      - edited
      - deleted
      - prereleased
      - released

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch release-changed event to artcraft-services
        env:
          DISPATCH_TOKEN: ${{ secrets.ARTCRAFT_SERVICES_DISPATCH_TOKEN }}
          EVENT_ACTION: ${{ github.event.action }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::warning::ARTCRAFT_SERVICES_DISPATCH_TOKEN is not configured; skipping artcraft-services rebuild dispatch."
            exit 0
          fi
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/storytold/artcraft-services/dispatches" \
            -d "{\"event_type\":\"craft-release-changed\",\"client_payload\":{\"repo\":\"${GITHUB_REPOSITORY}\",\"action\":\"${EVENT_ACTION}\",\"tag\":\"${RELEASE_TAG}\",\"prerelease\":${RELEASE_PRERELEASE}}}"
