[package]
name = "artcraft-launcher"
description = "ArtCraft Launcher: install, update and open the Craft App Suite"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "artcraft-launcher"
build = "build.rs"
publish = false

[lints]
workspace = true

[features]
# Development only: install from `cargo xtask local serve` (see the README).
local-mirror = ["artcraft-launcher-native/local-mirror"]
# Test builds only: leaves out Add-ons and Set up AI, so the rest of the interface can be tried alone.
without-add-ons-and-ai = []

[dependencies]
artcraft-launcher-core = { workspace = true }
artcraft-launcher-ui-egui = { workspace = true }
artcraft-launcher-native = { workspace = true }
craft-ext-core = { workspace = true }
craft-ext-store = { workspace = true }
# Interim path dependencies on the shared AI layer until it has a home (craft-libs).
craft-ai-client = { path = "../../../craft-ai-wt-folders/crates/ai-client" }
craft-ai-model = { path = "../../../craft-ai-wt-folders/crates/ai-core", package = "craft-ai-core" }
craft-ai-features = { path = "../../../craft-ai-wt-folders/crates/ai-features" }
craft-ai-native = { path = "../../../craft-ai-wt-folders/crates/ai-native" }
craft-ai-comfy-env = { path = "../../../craft-ai-wt-folders/crates/ai-comfy-env" }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "persistence", "links"] }
egui = { workspace = true }
log = { workspace = true }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
image = { version = "0.25", default-features = false, features = ["png"] }
notify-rust = "4"
# The person's Downloads folder for the history export, and the local time zone for dates (both are
# already in Cargo.lock through the native crate and env_logger).
dirs = "6"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system"] }
# Read and write eframe's settings file while there is no window (settings_file.rs). Already in
# Cargo.lock through eframe's "persistence" feature.
ron = "0.12.2"
serde = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

# The tray (menu bar) icon. On Linux and the BSDs the StatusNotifierItem backend talks D-Bus
# directly, so no GTK or libappindicator is needed.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = "0.25"

# macOS only: which desktop (Space) the window shows on (spaces.rs) and the "Reduce motion"
# setting (motion.rs). Safe AppKit calls only, and already in Cargo.lock through winit and
# tray-icon; pinned exactly to those versions.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSAccessibility", "NSApplication", "NSResponder", "NSWindow", "NSWorkspace"] }

# Windows only: the "Animation effects" setting (motion.rs). Already in Cargo.lock through
# artcraft-launcher-native.
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"

# Linux and the BSDs: the desktop's animations setting, from its settings portal (motion.rs).
# Already in Cargo.lock through tray-icon and notify-rust.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd", target_os = "dragonfly"))'.dependencies]
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }

[dev-dependencies]
craft-ai-openai = { path = "../../../craft-ai-wt-folders/crates/ai-openai" }
# The extensions tests build small packages by hand, with the versions the store itself uses.
serde_json = { workspace = true }
sha2 = "0.11.1"
tempfile = "3.27.0"
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }

[build-dependencies]
# Icon + VERSIONINFO for artcraft-launcher.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"
