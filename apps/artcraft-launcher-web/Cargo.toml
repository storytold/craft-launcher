[package]
name = "artcraft-launcher-web"
description = "ArtCraft Launcher in the browser: the Craft App Suite's latest releases, with downloads for the visitor's system"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "artcraft-launcher-web"
path = "src/main.rs"

[features]
default = []
server = [
    "dep:jiff",
    "dep:serde",
    "web-sys/Blob",
    "web-sys/CssStyleDeclaration",
    "web-sys/CustomEvent",
    "web-sys/DomRect",
    "web-sys/Event",
    "web-sys/EventTarget",
    "web-sys/HtmlAnchorElement",
    "web-sys/HtmlButtonElement",
    "web-sys/HtmlElement",
    "web-sys/HtmlHeadElement",
    "web-sys/HtmlIFrameElement",
    "web-sys/HtmlInputElement",
    "web-sys/HtmlSelectElement",
    "web-sys/KeyboardEvent",
    "web-sys/Location",
    "web-sys/MouseEvent",
    "web-sys/Node",
    "web-sys/PointerEvent",
    "web-sys/RequestCache",
    "web-sys/Url",
    "web-sys/UiEvent",
    "web-sys/UrlSearchParams",
    "web-sys/VisualViewport",
]

[dependencies]
jiff = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
artcraft-launcher-core = { workspace = true }
artcraft-launcher-ui-egui = { workspace = true }
egui = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `wgpu` pulls egui-wgpu's defaults: WebGPU plus the WebGL2 fallback.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "persistence"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "MediaQueryList", "Navigator", "Request", "RequestInit", "RequestMode", "Response", "Headers", "Storage", "AbortSignal", "ReadableStream", "ReadableStreamDefaultReader", "RequestRedirect"] }
